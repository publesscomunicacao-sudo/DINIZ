name: Temp catalog images 248
on:
  push:
    branches:
      - temp-catalog-images-248
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install requests beautifulsoup4 pillow
      - name: Collect and validate 248 images
        run: python temp_catalog_images/fetch_images.py
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: fotos-catalogo-mister-salve-248
          path: |
            fotos_catalogo_mister_salve_248.zip
            catalog_images_248/manifesto.csv
            catalog_images_248/RESUMO.txt
            catalog_images_248/contato_*.jpg
          if-no-files-found: error
          retention-days: 1
