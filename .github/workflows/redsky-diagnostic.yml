name: Temporary RedSky API diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Test public routes
        shell: bash
        run: |
          mkdir -p diagnostic
          set +e
          for url in \
            'https://api.redskydrop.com/produtos?skip=0&take=2&situacao=active' \
            'https://api.redskydrop.com/produtos/home' \
            'https://api.redskydrop.com/categorias?skip=0&take=2' \
            'https://redskydrop.com/catalog' \
            'https://redskydrop.com/robots.txt' \
            'https://redskydrop.com/sitemap.xml'; do
            key=$(echo "$url" | tr -cs 'A-Za-z0-9' '_' | cut -c1-100)
            echo "===== $url =====" | tee -a diagnostic/summary.txt
            curl -L --max-time 25 --connect-timeout 10 -sS -D "diagnostic/${key}.headers" -o "diagnostic/${key}.body" -w 'http=%{http_code} final=%{url_effective} type=%{content_type} bytes=%{size_download} time=%{time_total}\n' "$url" | tee -a diagnostic/summary.txt
            head -c 1000 "diagnostic/${key}.body" >> diagnostic/summary.txt
            printf '\n\n' >> diagnostic/summary.txt
          done
          getent ahosts api.redskydrop.com > diagnostic/dns-api.txt 2>&1
          getent ahosts redskydrop.com > diagnostic/dns-site.txt 2>&1
          cat diagnostic/summary.txt
          exit 0
      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: redsky-api-diagnostic
          path: diagnostic/
          retention-days: 1
          if-no-files-found: error
