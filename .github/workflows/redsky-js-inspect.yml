name: Temporary RedSky frontend inspection

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Download and inspect public frontend bundles
        shell: bash
        run: |
          mkdir -p frontend
          curl -L --max-time 30 -sS https://redskydrop.com/catalog -o frontend/catalog.html
          python3 - <<'PY'
          import re, pathlib, urllib.parse, urllib.request
          html = pathlib.Path('frontend/catalog.html').read_text(errors='ignore')
          urls = re.findall(r'<script[^>]+src=["\']([^"\']+)', html)
          urls += re.findall(r'<link[^>]+href=["\']([^"\']+\.js[^"\']*)', html)
          seen=[]
          for u in urls:
              full=urllib.parse.urljoin('https://redskydrop.com/catalog',u)
              if full in seen: continue
              seen.append(full)
              name=full.rsplit('/',1)[-1].split('?',1)[0]
              try:
                  data=urllib.request.urlopen(full,timeout=30).read()
                  pathlib.Path('frontend',name).write_bytes(data)
                  print(name,len(data),full)
              except Exception as e: print('ERR',full,e)
          PY
          python3 - <<'PY'
          import pathlib,re,json
          needles=['api.redskydrop','sessions/token','Authorization','Bearer','x-api','api-key','apikey','token','produtos','catalog','credentials','interceptor']
          out=[]
          for p in pathlib.Path('frontend').glob('*.js'):
              text=p.read_text(errors='ignore')
              for needle in needles:
                  start=0
                  while True:
                      i=text.lower().find(needle.lower(),start)
                      if i<0: break
                      out.append({'file':p.name,'needle':needle,'offset':i,'context':text[max(0,i-500):i+1200]})
                      start=i+len(needle)
                      if sum(1 for x in out if x['file']==p.name and x['needle']==needle)>=30: break
          pathlib.Path('frontend/matches.json').write_text(json.dumps(out,ensure_ascii=False,indent=2))
          print('matches',len(out))
          PY
      - name: Upload frontend bundles
        uses: actions/upload-artifact@v4
        with:
          name: redsky-frontend-bundles
          path: frontend/
          retention-days: 1
          if-no-files-found: error
